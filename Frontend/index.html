<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SigmaGPT - Gemini</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="app-container">

        <!-- ================= SIDEBAR ================= -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <h4 class="logo">SigmaGPT</h4>

                <button id="newChatBtn" class="btn new-chat-btn">
                    + New Chat
                </button>
            </div>

            <div class="chat-history">

                <p class="history-title">Recent Chats</p>

                <div id="historyList">
                    <!-- Chats will come here using JavaScript -->
                </div>

            </div>

        </aside>


        <!-- ================= MAIN CHAT ================= -->
        <main class="main-content">

            <!-- Chat Header -->
            <!-- Chat Header -->
<header class="chat-header">

    <button
        id="menuBtn"
        class="menu-btn"
        type="button"
    >
        ☰
    </button>

    <h5>SigmaGPT</h5>

    <button
        id="logoutBtn"
        type="button"
        class="logout-btn"
    >
        Logout
    </button>

</header>

            <!-- ================= CHAT AREA ================= -->
            <section id="chatContainer" class="chat-container">

                <!-- Welcome screen -->
                <div id="welcomeScreen" class="welcome-screen">

                    <h1>How can I help you?</h1>

                    <p>
                        Ask anything and Gemini will help you.
                    </p>

                </div>

                <!-- Messages will be inserted here -->
                <div id="messagesContainer"></div>

            </section>


            <!-- ================= MESSAGE INPUT ================= -->
            <footer class="input-area">

                <form id="chatForm" class="chat-form">

                    <input
                        type="text"
                        id="messageInput"
                        class="form-control"
                        placeholder="Ask anything..."
                        autocomplete="off"
                    >

                    <button
                        type="submit"
                        id="sendBtn"
                        class="btn btn-dark"
                    >
                        ➤
                    </button>

                </form>

                <p class="disclaimer">
                    Gemini can make mistakes. Check important information.
                </p>

            </footer>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Our JavaScript -->
    <script src="./js/script.js"></script>

</body>
</html>
