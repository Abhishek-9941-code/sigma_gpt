<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SigmaGPT</title>
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>

    <div class="auth-container">

    <div class="auth-card">

        <h1>SigmaGPT</h1>

        <h2>Create Account</h2>

        <p class="auth-subtitle">
            Create your account to start chatting
        </p>

        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerBtn"
            >
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p class="auth-link">
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</div>

    <script>

        const registerForm =
            document.getElementById("registerForm");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const registerBtn =
            document.getElementById("registerBtn");

        const message =
            document.getElementById("message");


        registerForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const name =
                    nameInput.value.trim();

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                registerBtn.disabled = true;

                registerBtn.textContent =
                    "Creating account...";

                message.textContent = "";


                try {

                    const response = await fetch(
                        `https://sigma-gpt-c5bt.onrender.com/api/auth/register`,
                        {
                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name,
                                email,
                                password
                            })
                        }
                    );


                    const contentType =
                        response.headers.get(
                            "content-type"
                        );

                    let data;


                    if (
                        contentType &&
                        contentType.includes(
                            "application/json"
                        )
                    ) {

                        data = await response.json();

                    } else {

                        data = {
                            error:
                                await response.text()
                        };

                    }


                    console.log(
                        "Register Response:",
                        data
                    );


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Registration failed"
                        );

                    }


                    message.textContent =
                        "Account created successfully!";


                    // Registration ke baad
                    // login page par bhejo

                    setTimeout(() => {

                        window.location.href =
                            "login.html";

                    }, 700);


                } catch (error) {

                    console.error(
                        "Register Error:",
                        error
                    );

                    message.textContent =
                        error.message ||
                        "Registration failed";


                } finally {

                    registerBtn.disabled = false;

                    registerBtn.textContent =
                        "Register";

                }

            }
        );

    </script>

</body>

</html>
